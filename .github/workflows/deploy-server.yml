name: Deploy server (Cloudflare)
on:
  push:
    branches: [main, master]
    paths: ['server/**', 'www/**', '.github/workflows/deploy-server.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STATS_KEY: ${{ secrets.STATS_KEY }}
    steps:
      - name: Check secrets
        id: chk
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Server not deployed: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (see README)."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.skip != '1'
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.skip != '1'
        with: { node-version: 22 }
      - name: Deploy
        if: steps.chk.outputs.skip != '1'
        run: |
          npm install --no-fund --no-audit
          npm run vendor
          cd server
          npm install --no-fund --no-audit
          W=./node_modules/.bin/wrangler
          # database: create once, then reuse
          DBID=$($W d1 list --json | node -e "let d=JSON.parse(require('fs').readFileSync(0,'utf8'));let x=d.find(v=>v.name==='metro-alert-db');process.stdout.write(x?x.uuid:'')")
          if [ -z "$DBID" ]; then
            $W d1 create metro-alert-db
            DBID=$($W d1 list --json | node -e "let d=JSON.parse(require('fs').readFileSync(0,'utf8'));process.stdout.write(d.find(v=>v.name==='metro-alert-db').uuid)")
          fi
          sed -i "s/DATABASE_ID/$DBID/" wrangler.toml
          $W d1 execute metro-alert-db --remote --file=schema.sql -y
          # bus timetable: load only when it changed (saves the free plan's daily write quota)
          WANT=$(cat data/bus_departures.sql.version)
          HAVE=$($W d1 execute metro-alert-db --remote --json --command "SELECT v FROM meta WHERE k='bus_dep'" | node -e "try{const d=JSON.parse(require('fs').readFileSync(0,'utf8'));process.stdout.write(((d[0].results||[])[0]||{}).v||'')}catch(e){}")
          if [ "$WANT" != "$HAVE" ]; then
            echo "Loading bus timetable ($HAVE -> $WANT)"
            $W d1 execute metro-alert-db --remote --file=data/bus_departures.sql -y
          else
            echo "Bus timetable up to date ($HAVE)"
          fi
          $W deploy | tee deploy.log
          if [ -n "$STATS_KEY" ]; then printf '%s' "$STATS_KEY" | $W secret put STATS_KEY; fi
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "### Metro Alert server is live" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web app: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stats: $URL/stats" >> "$GITHUB_STEP_SUMMARY"
          echo "SERVER_URL=$URL"
