name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the GitHub Release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # GitHub's Ubuntu runners ship with the Android SDK; just accept its licences
      - name: Android SDK licences
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Read version
        id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Create Android project (v${{ steps.ver.outputs.v }})
        run: npm run android

      - name: App icons
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#E4002B'

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/metro-alert-v${{ steps.ver.outputs.v }}.apk

      - name: Web build
        run: node scripts/package-web.js

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: metro-alert-v${{ steps.ver.outputs.v }}
          path: dist/*

      - name: Publish GitHub Release v${{ steps.ver.outputs.v }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Metro Alert v${{ steps.ver.outputs.v }}
          body_path: CHANGELOG.md
          files: dist/*
          make_latest: true
